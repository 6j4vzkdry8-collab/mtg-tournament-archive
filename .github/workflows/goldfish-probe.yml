name: goldfish-probe

# 一次性诊断：从 GitHub Actions 发不伪装浏览器的请求，
# 区分 403 是封 IP 还是因为 publish 里伪装的 Chrome 头被识别。
# 结论出来后删掉这个文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Plain curl (default UA)
        run: |
          curl -sS -o /dev/null -D - https://www.mtggoldfish.com/tournaments/standard \
            | grep -iE '^(HTTP|server|cf-ray|cf-mitigated)' || true

      - name: Honest bot UA
        run: |
          sleep 5
          curl -sS -o /dev/null -D - \
            -A 'mtg-tournament-archive/1.0 (+https://github.com)' \
            https://www.mtggoldfish.com/tournaments/standard \
            | grep -iE '^(HTTP|server|cf-ray|cf-mitigated)' || true
